name: C11 checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m pip install -r research/requirements-smt.txt
      - run: make smt-check smt-research
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interlock-smt
          path: |
            build/smt_*.json
            build/smt_*.smt2
          if-no-files-found: error
          retention-days: 7
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        optimization: [0, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make all check CC=${{ matrix.cc }} CFLAGS=-O${{ matrix.optimization }}
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make sanitize CC=${{ matrix.cc }}
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make research CC=gcc CFLAGS=-O2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interlock-research
          path: build/*.json
          if-no-files-found: error
          retention-days: 7
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armhf
            cc: arm-linux-gnueabihf-gcc
            packages: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
            runner: qemu-arm
            bits: 32
            big_endian: 0
          - target: s390x
            cc: s390x-linux-gnu-gcc
            packages: gcc-s390x-linux-gnu libc6-dev-s390x-cross
            runner: qemu-s390x
            bits: 64
            big_endian: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y qemu-user ${{ matrix.packages }}
      - run: >-
          make all check-c CC=${{ matrix.cc }} LDFLAGS=-static
          RUNNER=${{ matrix.runner }}
          CPPFLAGS="-DIL_EXPECT_SIZE_T_BITS=${{ matrix.bits }} -DIL_EXPECT_BIG_ENDIAN=${{ matrix.big_endian }}"
  secret-taint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y valgrind libc6-dbg
      - run: make ct-check CC=${{ matrix.cc }} CFLAGS=-O2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: interlock-secret-taint-${{ matrix.cc }}
          path: build/ctcheck*
          if-no-files-found: error
          retention-days: 7
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make fuzz CC=clang CFLAGS="-O1 -g -fno-omit-frame-pointer"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: interlock-fuzz-failure
          path: |
            build/crash-*
            build/timeout-*
            build/leak-*
            build/oom-*
          if-no-files-found: ignore
          retention-days: 7
  measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make measure CC=${{ matrix.cc }} CFLAGS=-O2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interlock-measurement-${{ matrix.cc }}
          path: |
            build/benchmark.json
            build/measure/*.su
          if-no-files-found: error
          retention-days: 7
