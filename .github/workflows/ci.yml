name: C11 checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m pip install -r research/requirements-smt.txt
      - run: make smt-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interlock-smt
          path: build/smt_*.json
          if-no-files-found: error
          retention-days: 7
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        optimization: [0, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make all check CC=${{ matrix.cc }} CFLAGS=-O${{ matrix.optimization }}
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make sanitize CC=${{ matrix.cc }}
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make research CC=gcc CFLAGS=-O2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interlock-research
          path: build/*.json
          if-no-files-found: error
          retention-days: 7
